<div class="container">
    <h3>Register</h3>
     <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" >
      <input type="text" placeholder="Username" class="inp">
      <input type="text" placeholder="Email" class="inp">
      <input type="password" placeholder="Password" class="inp">
      <button type="submit" class="bt">Sign up</button>
     </form>
     <br>
     <button type="button" class="bt-transparent" (click)="goToLogin()">Sign in.</button>
  </div>
