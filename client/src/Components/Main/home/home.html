
<app-navbar/>

<div class="container">
    <div class="page">
        <button>HOME</button>
    </div>
    <div class="post-container" *ngFor="let post of posts">
        <div class="post-header">
            <strong>{{post.authorUsername}}</strong>
            <div class="parent">
                <div>
                    <button class="bt-transparent t-g" type="button" (click)="showMenu()">●●●</button>
                </div>
                <div class="child" *ngIf="menu">
                    <button type="button" (click)="deletePost(post.id)">delete post</button>
                </div>
            </div>
        </div>
        <div class="text-content">
            {{post.content}}
        </div>

            <img src="https://i.pinimg.com/1200x/e8/78/cb/e878cb55dda37b2876848988cecb34b8.jpg" alt="apt" >
        </div> -->
    </div>
</div>
